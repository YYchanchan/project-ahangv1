services:
  mysql:
    image: mysql:8.4
    container_name: project-ahang-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: project_ahang_root_dev
      MYSQL_DATABASE: project_ahang
      MYSQL_USER: project_ahang
      MYSQL_PASSWORD: project_ahang_dev
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - project-ahang-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pproject_ahang_root_dev"]
      interval: 5s
      timeout: 4s
      retries: 20

volumes:
  project-ahang-mysql-data:
